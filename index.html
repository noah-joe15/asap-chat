<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAP Chat</title>
    <!-- FontAwesome for Smart Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind for base layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* CSS Variables for Dynamic Color Changing */
        :root {
            --primary-color: #00a884; /* Default WhatsApp Green */
            --primary-hover: #008f6f;
        }
    </style>
</head>
<body>

    <!-- Liquid Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="glass-panel flex items-center justify-center h-screen fixed inset-0 z-50">
        <div class="glass-card p-8 rounded-3xl w-80 text-center">
            <div class="text-4xl mb-4 text-white"><i class="fa-solid fa-comments"></i></div>
            <h1 class="text-2xl font-bold mb-6 text-white tracking-wide">ASAP Chat</h1>
            <input id="email-input" type="email" placeholder="Email" class="glass-input w-full p-3 rounded-xl mb-3 text-white placeholder-gray-300">
            <input id="password-input" type="password" placeholder="Password" class="glass-input w-full p-3 rounded-xl mb-3 text-white placeholder-gray-300">
            <input id="username-input" type="text" placeholder="Display Name" class="glass-input w-full p-3 rounded-xl mb-6 text-white placeholder-gray-300">
            
            <div class="flex gap-3">
                <button id="login-btn" class="flex-1 btn-primary p-3 rounded-xl font-semibold text-white"><i class="fa-solid fa-right-to-bracket mr-2"></i>Login</button>
                <button id="signup-btn" class="flex-1 btn-secondary p-3 rounded-xl font-semibold text-white"><i class="fa-solid fa-user-plus mr-2"></i>Sign Up</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen" class="hidden h-screen flex flex-col relative z-10">
        <!-- Header -->
        <header class="glass-header p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-bolt"></i> ASAP Chat</h1>
            <div class="flex gap-2 items-center">
                <!-- Color Picker -->
                <div class="flex items-center bg-white/20 rounded-full px-3 py-1 mr-2">
                    <i class="fa-solid fa-palette text-white text-sm mr-2"></i>
                    <input type="color" id="theme-color-picker" value="#00a884" class="w-6 h-6 rounded-full cursor-pointer border-none bg-transparent">
                </div>
                <button id="new-group-btn" class="icon-btn" title="New Group"><i class="fa-solid fa-users"></i></button>
                <button id="new-dm-btn" class="icon-btn" title="New 1-on-1"><i class="fa-solid fa-user-plus"></i></button>
                <button id="logout-btn" class="icon-btn text-red-300 hover:text-red-500" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <!-- Sidebar: Chats List -->
            <aside class="w-1/3 glass-sidebar overflow-y-auto">
                <div id="chats-list" class="p-3"></div>
            </aside>

            <!-- Main: Chat Window -->
            <main class="flex-1 flex flex-col relative">
                <div id="chat-header" class="glass-header p-4 font-semibold text-lg text-white hidden border-b border-white/10"></div>
                
                <div id="messages-container" class="flex-1 overflow-y-auto p-4 chat-container flex flex-col gap-2">
                    <p id="empty-chat-msg" class="text-center text-white/50 mt-10 text-lg"><i class="fa-regular fa-comments mr-2"></i>Select a chat to start messaging</p>
                </div>

                <div id="input-area" class="glass-header p-4 hidden border-t border-white/10">
                    <form id="message-form" class="flex gap-3 items-center">
                        <input id="message-input" type="text" placeholder="Type a message..." class="glass-input flex-1 p-3 rounded-full text-white placeholder-gray-300">
                        <button type="submit" class="btn-primary w-12 h-12 rounded-full flex items-center justify-center text-white text-lg"><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL FOR CREATING CHATS -->
    <div id="modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="glass-card p-6 rounded-3xl w-80">
            <h2 id="modal-title" class="text-xl font-bold mb-4 text-white"></h2>
            <input id="modal-input" type="text" class="glass-input w-full p-3 rounded-xl mb-4 text-white placeholder-gray-300" placeholder="">
            <div class="flex justify-end gap-3">
                <button id="modal-cancel" class="px-4 py-2 text-white/70 hover:text-white">Cancel</button>
                <button id="modal-save" class="btn-primary px-6 py-2 rounded-xl text-white font-semibold">Create</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query, where, orderBy, serverTimestamp, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCEMqKLVJnjEwTGe3XKGzsVZqrrr2gU4xg",
            authDomain: "asap-chat-a4d31.firebaseapp.com",
            projectId: "asap-chat-a4d31",
            storageBucket: "asap-chat-a4d31.firebasestorage.app",
            messagingSenderId: "1099390805568",
            appId: "1:1099390805568:web:4ef8fbc076c9940465e1a5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentChatId = null;
        let unsubscribeChats = null;
        let unsubscribeMessages = null;

        // UI Elements
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        const signupBtn = document.getElementById('signup-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const colorPicker = document.getElementById('theme-color-picker');
        
        const chatsList = document.getElementById('chats-list');
        const chatHeader = document.getElementById('chat-header');
        const messagesContainer = document.getElementById('messages-container');
        const emptyChatMsg = document.getElementById('empty-chat-msg');
        const inputArea = document.getElementById('input-area');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalInput = document.getElementById('modal-input');

        // --- COLOR PICKER LOGIC ---
        const savedColor = localStorage.getItem('chatThemeColor');
        if (savedColor) {
            document.documentElement.style.setProperty('--primary-color', savedColor);
            colorPicker.value = savedColor;
        }
        colorPicker.addEventListener('input', (e) => {
            const color = e.target.value;
            document.documentElement.style.setProperty('--primary-color', color);
            localStorage.setItem('chatThemeColor', color);
        });

        function showApp(user) {
            currentUser = user;
            loginScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            loadChats();
        }

        signupBtn.onclick = async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const name = usernameInput.value.trim();
            if (!email || !password || !name) return alert("Please fill in all fields.");
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", userCred.user.uid), { username: name, email: email, createdAt: serverTimestamp() });
                showApp(userCred.user);
            } catch (e) { alert("Sign Up Error: " + e.message); }
        };

        loginBtn.onclick = async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            if (!email || !password) return alert("Please enter email and password.");
            try {
                const userCred = await signInWithEmailAndPassword(auth, email, password);
                showApp(userCred.user);
            } catch (e) { alert("Login Error: " + e.message); }
        };

        logoutBtn.onclick = () => {
            signOut(auth).then(() => {
                appScreen.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                if (unsubscribeChats) unsubscribeChats();
                if (unsubscribeMessages) unsubscribeMessages();
            });
        };

        function loadChats() {
            if (unsubscribeChats) unsubscribeChats();
            const q = query(collection(db, "chats"), where("members", "array-contains", currentUser.uid));
            unsubscribeChats = onSnapshot(q, async (snapshot) => {
                chatsList.innerHTML = '';
                const chatPromises = snapshot.docs.map(async (docSnap) => {
                    const data = docSnap.data();
                    let displayName = data.name;
                    if (data.type === 'direct') {
                        const otherUid = data.members.find(m => m !== currentUser.uid);
                        const otherUserDoc = await getDoc(doc(db, "users", otherUid));
                        displayName = otherUserDoc.exists() ? otherUserDoc.data().username : "Unknown";
                    }
                    const div = document.createElement('div');
                    div.className = `chat-item p-3 rounded-xl mb-2 cursor-pointer ${currentChatId === docSnap.id ? 'active-chat' : ''}`;
                    div.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white font-bold text-lg">
                                ${displayName.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <div class="font-semibold text-white">${displayName}</div>
                                <div class="text-xs text-white/60">${data.type === 'group' ? '<i class="fa-solid fa-users mr-1"></i>Group' : '<i class="fa-solid fa-user mr-1"></i>Direct'}</div>
                            </div>
                        </div>
                    `;
                    div.onclick = () => openChat(docSnap.id, displayName);
                    chatsList.appendChild(div);
                });
                await Promise.all(chatPromises);
            });
        }

        function openChat(chatId, name) {
            currentChatId = chatId;
            chatHeader.textContent = name;
            chatHeader.classList.remove('hidden');
            inputArea.classList.remove('hidden');
            emptyChatMsg.classList.add('hidden');
            loadChats();
            if (unsubscribeMessages) unsubscribeMessages();
            messagesContainer.innerHTML = '';
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                messagesContainer.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isMe = msg.senderId === currentUser.uid;
                    const bubble = document.createElement('div');
                    bubble.className = `msg-bubble p-3 ${isMe ? 'sent' : 'received'}`;
                    bubble.innerHTML = `
                        ${!isMe ? `<div class="text-xs font-bold mb-1 opacity-75">${msg.senderName}</div>` : ''}
                        <div>${msg.text}</div>
                    `;
                    messagesContainer.appendChild(bubble);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        messageForm.onsubmit = async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentChatId) return;
            const userDoc = await getDoc(doc(db, "users", currentUser.uid));
            const senderName = userDoc.exists() ? userDoc.data().username : "User";
            await addDoc(collection(db, "chats", currentChatId, "messages"), {
                text: text, senderId: currentUser.uid, senderName: senderName, timestamp: serverTimestamp()
            });
            messageInput.value = '';
        };

        document.getElementById('new-group-btn').onclick = () => showModal('Create Group', 'Enter Group Name', 'group');
        document.getElementById('new-dm-btn').onclick = () => showModal('Start 1-on-1', 'Enter exact Display Name', 'direct');
        document.getElementById('modal-cancel').onclick = () => modal.classList.add('hidden');

        function showModal(title, placeholder, type) {
            modalTitle.textContent = title;
            modalInput.placeholder = placeholder;
            modalInput.value = '';
            modal.classList.remove('hidden');
            document.getElementById('modal-save').onclick = async () => {
                const val = modalInput.value.trim();
                if (!val) return;
                modal.classList.add('hidden');
                if (type === 'group') {
                    await addDoc(collection(db, "chats"), { name: val, type: 'group', members: [currentUser.uid], createdAt: serverTimestamp() });
                } else {
                    const usersSnap = await getDocs(collection(db, "users"));
                    let targetUser = null;
                    usersSnap.forEach(d => { if(d.data().username && d.data().username.toLowerCase() === val.toLowerCase()) targetUser = { id: d.id, ...d.data() }; });
                    if (!targetUser) return alert("User not found.");
                    if (targetUser.id === currentUser.uid) return alert("Cannot message yourself.");
                    const chatId = [currentUser.uid, targetUser.id].sort().join('_');
                    await setDoc(doc(db, "chats", chatId), { type: 'direct', members: [currentUser.uid, targetUser.id], createdAt: serverTimestamp() }, { merge: true });
                }
            };
        }
    </script>
</body>
</html>
