        : window.innerHeight;

    document.documentElement.style.setProperty(
        "--app-height",
        `${height}px`

}

});

    window.visualViewport.addEventListener(

}

/* =========================================================
   CONNECTION
========================================================= */

function updateConnectionStatus(online) {

    isOnline = online;

    if (online) {

        connectionBanner.className =
            "connection-banner online show";

        connectionMessage.textContent =
            "Connected";

        setTimeout(() => {

            connectionBanner.classList.remove("show");

        }, 2000);

    } else {

        connectionBanner.className =
            "connection-banner offline show";

        connectionMessage.textContent =
            "No Internet Connection";

    }

}


window.addEventListener(
    "online",
    () => updateConnectionStatus(true)
);

window.addEventListener(
    "offline",
    () => updateConnectionStatus(false)
);


/* =========================================================
   AUTH
========================================================= */

window.addEventListener("appReady", () => {

    if (
        localStorage.getItem("appVersion") !==
        APP_VERSION
    ) {

        updateBanner.classList.add("show");

        updateMessage.innerHTML =
            `<strong>New Update!</strong>
             Mobile chat layout fixed.
             <button id="refresh-app-btn"
                     class="update-btn">
                 Refresh Now
             </button>`;

        const refreshBtn =
            document.getElementById(
                "refresh-app-btn"
            );

        if (refreshBtn) {

            refreshBtn.onclick = () => {

                localStorage.setItem(
                    "appVersion",
                    APP_VERSION
                );

                window.location.reload();

            };

        }

    }


    onAuthStateChanged(
        auth,
        user => {

            if (user) {

                currentUser = user;

                loginScreen.classList.add("hidden");

                appScreen.classList.remove("hidden");

                if (!chatsLoaded) {

                    loadChats();

                    chatsLoaded = true;

                }

            } else {

                currentUser = null;

                chatsLoaded = false;

                loginScreen.classList.remove("hidden");

                appScreen.classList.add("hidden");

            }

        }
    );

});


/* =========================================================
   SIGN UP
========================================================= */

signupBtn.onclick = async () => {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value.trim();

    const name =
        usernameInput.value.trim();


    if (!email || !password || !name) {

        alert(
            "Please fill in all fields."
        );

        return;

    }


    try {

        const userCred =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        await setDoc(
            doc(
                db,
                "users",
                userCred.user.uid
            ),
            {
                username: name,
                email: email,
                createdAt: serverTimestamp()
            }
        );

    } catch (e) {

        alert(
            e.code ===
            "auth/network-request-failed"
                ? "Network error. Check connection."
                : "Sign Up Error: " + e.message
        );

    }

};


/* =========================================================
   LOGIN
========================================================= */

loginBtn.onclick = async () => {

            "Please enter email and password."

};

/* =========================================================
   SMART TIME
========================================================= */

function getSmartTime(timestamp) {

    if (!timestamp)
        return "";

    const date =
        timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);

    const now = new Date();

    const diffMs =
        now - date;

    const diffMins =
        Math.floor(diffMs / 60000);

    const diffHours =
        Math.floor(diffMs / 3600000);

    const diffDays =
        Math.floor(diffMs / 86400000);


    if (diffMins < 1)
        return "Just now";

    if (diffMins < 60)
        return `${diffMins}m ago`;

    if (diffHours < 24)
        return `${diffHours}h ago`;

    if (diffDays === 1)
        return "Yesterday";

    return date.toLocaleDateString();

}


/* =========================================================
   LOAD CHATS
========================================================= */

function loadChats() {

    if (unsubscribeChats) {

        unsubscribeChats();

        unsubscribeChats = null;

    }


    const q = query(
        collection(db, "chats"),
        where(
            "members",
            "array-contains",
            currentUser.uid
        )
    );


    unsubscribeChats =
        onSnapshot(
            q,
            async snapshot => {

                chatsList.innerHTML = "";

                knownUsers = [];


                if (snapshot.empty) {

                    chatsList.innerHTML =
                        `<p class="no-chats">
                            No chats yet.
                            Click + to start one!
                         </p>`;

                    return;

                }


                const renderPromises =
                    snapshot.docs.map(
                        async docSnap => {

                            const data =
                                docSnap.data();

                            let displayName =
                                data.name ||
                                "Chat";

                            let icon =
                                "fa-user";

                            let otherUserId =
                                null;


                            if (
                                data.type ===
                                "direct"
                            ) {

                                otherUserId =
                                    data.members.find(
                                        m =>
                                            m !==
                                            currentUser.uid
                                    );


                                if (otherUserId) {

                                    const userDoc =
                                        await getDoc(
                                            doc(
                                                db,
                                                "users",
                                                otherUserId
                                            )
                                        );


                                    if (
                                        userDoc.exists()
                                    ) {

                                        displayName =
                                            userDoc.data()
                                                .username;

                                        knownUsers.push({
                                            id:
                                                otherUserId,
                                            username:
                                                displayName
                                        });

                                    } else {

                                        displayName =
                                            "Unknown User";

                                    }

                                }

                            } else {

                                icon = "fa-users";

                            }


                            const unreadCount =
                                data.unreadCounts?.[
                                    currentUser.uid
                                ] || 0;


                            const div =
                                document.createElement(
                                    "div"
                                );


                            div.className =
                                `chat-item ${
                                    currentChatId ===
                                    docSnap.id
                                        ? "active-chat"
                                        : ""
                                }`;


                            div.innerHTML = `

                                <div class="chat-avatar">
                                    <i class="fa-solid ${icon}"></i>
                                </div>

                                <div class="chat-item-details">

                                    <div class="chat-name">
                                        ${displayName}
                                    </div>

                                    <div class="chat-type">
                                        ${
                                            data.type ===
                                            "group"
                                                ? "Group Chat"
                                                : "Direct Message"
                                        }
                                    </div>

                                </div>

                                ${
                                    unreadCount > 0
                                        ? `<div class="unread-badge">
                                            ${
                                                unreadCount > 99
                                                    ? "99+"
                                                    : unreadCount
                                            }
                                           </div>`
                                        : ""
                                }

                            `;


                            div.onclick = () => {

                                openChat(
                                    docSnap.id,
                                    displayName
                                );

                                closeSidebar();

                            };


                            chatsList.appendChild(
                                div
                            );

                        }
                    );


                await Promise.all(
                    renderPromises
                );

            },

            error => {

                console.error(
                    "Chat listener error:",
                    error
                );

            }
        );

}


/* =========================================================
   OPEN CHAT
========================================================= */

async function openChat(
    chatId,
    name
) {

    currentChatId =
        chatId;


    chatHeader.classList.remove(
        "hidden"
    );


    chatHeaderName.textContent =
        name;


    inputArea.classList.add(
        "input-visible"
    );


    emptyChatMsg.classList.add(
        "hidden"
    );


    const chatRef =
        doc(
            db,
            "chats",
            chatId
        );


    try {

        await updateDoc(
            chatRef,
            {
                [`unreadCounts.${currentUser.uid}`]:
                    0
            }
        );

    } catch (e) {

        console.warn(
            "Unread update failed:",
            e
        );

    }


    if (unsubscribeMessages)
        unsubscribeMessages();

    if (unsubscribeTyping)
        unsubscribeTyping();


    messagesContainer.innerHTML =
        "";


    const q =
        query(
            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),
            orderBy(
                "timestamp",
                "asc"
            )
        );


    let initialLoad = true;


    unsubscribeMessages =
        onSnapshot(
            q,
            { includeMetadataChanges: true },
            snapshot => {

                if (initialLoad) {

                    snapshot.forEach(
                        docSnap =>
                            renderMessage(
                                docSnap
                            )
                    );

                    initialLoad = false;

                } else {

                    snapshot.docChanges()
                        .forEach(change => {

                            if (
                                change.type ===
                                "added"
                            ) {

                                renderMessage(
                                    change.doc
                                );


                                const msg =
                                    change.doc.data();


                                if (
                                    msg.senderId !==
                                    currentUser.uid
                                ) {

                                    notificationSound
                                        .currentTime = 0;

                                    notificationSound
                                        .play()
                                        .catch(
                                            () => {}
                                        );

                                }

                            }

                        });

                }


                requestAnimationFrame(
                    () => {

                        messagesContainer.scrollTop =
                            messagesContainer.scrollHeight;

                    }
                );

            }
        );


    unsubscribeTyping =
        onSnapshot(
            chatRef,
            docSnap => {

                if (!docSnap.exists())
                    return;


                const data =
                    docSnap.data();


                const typingData =
                    data.typing || {};


                const otherUserIds =
                    data.members.filter(
                        uid =>
                            uid !==
                            currentUser.uid
                    );


                const typingUsers = [];


                otherUserIds.forEach(
                    uid => {

                        if (
                            typingData[uid] &&
                            typingData[uid].seconds
                        ) {

                            const lastTyped =
                                typingData[uid].seconds *
                                1000;


                            if (
                                Date.now() -
                                lastTyped <
                                3000
                            ) {

                                const user =
                                    knownUsers.find(
                                        u =>
                                            u.id ===
                                            uid
                                    );


                                if (user)
                                    typingUsers.push(
                                        user.username
                                    );

                            }

                        }

                    }
                );


                if (
                    typingUsers.length
                ) {

                    typingIndicator.textContent =
                        `${typingUsers.join(", ")} ${
                            typingUsers.length === 1
                                ? "is"
                                : "are"
                        } typing...`;

                    typingIndicator.classList.remove(
                        "hidden"
                    );

                } else {

                    typingIndicator.classList.add(
                        "hidden"
                    );

                }

            }
        );


    /* Focus input only after user explicitly opened chat */

    setTimeout(() => {

        if (
            window.innerWidth >
            768
        ) {

            messageInput.focus();

        }

    }, 100);

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(
    docSnap
) {

    const msg =
        docSnap.data();


    const isMe =
        msg.senderId ===
        currentUser.uid;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        `msg-bubble ${
            isMe
                ? "sent"
                : "received"
        }`;


    const deleteBtn =
        isMe
            ? `<button
                    class="delete-msg-btn"
                    data-id="${docSnap.id}"
                    title="Delete"
               >
                    <i class="fa-solid fa-trash-can"></i>
               </button>`
            : "";


    let contentHtml = "";


    if (
        msg.type ===
        "voice"
    ) {

        contentHtml = `

            ${
                !isMe
                    ? `<div class="sender-name">
                            ${msg.senderName || "User"}
                       </div>`
                    : ""
            }

            <audio
                controls
                src="${msg.audioData}"
                class="voice-note-player"
            ></audio>

        `;

    } else {

        contentHtml = `

            ${
                !isMe
                    ? `<div class="sender-name">
                            ${msg.senderName || "User"}
                       </div>`
                    : ""
            }

            <div class="message-text">
                ${msg.text || ""}
            </div>

        `;

    }


    bubble.innerHTML = `

        ${deleteBtn}

        ${contentHtml}

        <span class="msg-time">
            ${getSmartTime(msg.timestamp)}
        </span>

    `;


    messagesContainer.appendChild(
        bubble
    );

}


/* =========================================================
   DELETE MESSAGE
========================================================= */

messagesContainer.addEventListener(
    "click",
    async e => {

        const deleteBtn =
            e.target.closest(
                ".delete-msg-btn"
            );


        if (
            !deleteBtn ||
            !currentChatId
        )
            return;


        if (
            !confirm(
                "Delete this message?"
            )
        )
            return;


        try {

            await deleteDoc(
                doc(
                    db,
                    "chats",
                    currentChatId,
                    "messages",
                    deleteBtn.dataset.id
                )
            );

        } catch (e) {

            alert(
                "Failed to delete message."
            );

        }

    }
);


/* =========================================================
   TYPING
========================================================= */

let lastTypingUpdate = 0;


messageInput.addEventListener(
    "input",
    () => {

        const now =
            Date.now();


        if (
            now -
            lastTypingUpdate >
            2000 &&
            currentChatId
        ) {

            updateDoc(
                doc(
                    db,
                    "chats",
                    currentChatId
                ),
                {
                    [`typing.${currentUser.uid}`]:
                        serverTimestamp()
                }
            ).catch(
                () => {}
            );


            lastTypingUpdate =
                now;

        }

    }
);


/* =========================================================
   SEND MESSAGE
========================================================= */

sendBtn.addEventListener(
    "click",
    async e => {

        e.preventDefault();


        const text =
            messageInput.value.trim();


        if (
            !text ||
            !currentChatId
        )
            return;


        if (!isOnline) {

            alert(
                "You are offline."
            );

            return;

        }


        sendBtn.disabled =
            true;


        sendBtn.classList.add(
            "sending"
        );


        try {

            const userDoc =
                await getDoc(
                    doc(
                        db,
                        "users",
                        currentUser.uid
                    )
                );


            const senderName =
                userDoc.exists()
                    ? userDoc.data()
                        .username
                    : "User";


            await addDoc(
                collection(
                    db,
                    "chats",
                    currentChatId,
                    "messages"
                ),
                {
                    type: "text",
                    text: text,
                    senderId:
                        currentUser.uid,
                    senderName:
                        senderName,
                    timestamp:
                        serverTimestamp()
                }
            );


            await updateDoc(
                doc(
                    db,
                    "chats",
                    currentChatId
                ),
                {
                    [`typing.${currentUser.uid}`]:
                        null
                }
            ).catch(
                () => {}
            );


            const chatRef =
                doc(
                    db,
                    "chats",
                    currentChatId
                );


            const chatSnap =
                await getDoc(
                    chatRef
                );


            if (
                chatSnap.exists()
            ) {

                const members =
                    chatSnap.data()
                        .members || [];


                const updates = {};


                members.forEach(
                    uid => {

                        if (
                            uid !==
                            currentUser.uid
                        ) {

                            updates[
                                `unreadCounts.${uid}`
                            ] =
                                increment(1);

                        }

                    }
                );


                if (
                    Object.keys(
                        updates
                    ).length
                ) {

                    await updateDoc(
                        chatRef,
                        updates
                    );

                }

            }


            messageInput.value =
                "";


            messageInput.focus();


        } catch (e) {

            console.error(e);

            alert(
                "Failed to send message."
            );

        } finally {

            sendBtn.disabled =
                false;

            sendBtn.classList.remove(
                "sending"
            );

        }

    }
);


/* =========================================================
   VOICE RECORDING
========================================================= */

micBtn.addEventListener(
    "click",
    async () => {

        if (
            micBtn.classList.contains(
                "recording"
            )
        ) {

            stopRecording();

            return;

        }


        if (!currentChatId) {

            alert(
                "Select a chat first."
            );

            return;

        }


        try {

            const stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio: true
                    });


            mediaRecorder =
                new MediaRecorder(
                    stream
                );


            audioChunks = [];

            recordingSeconds = 0;


            mediaRecorder.ondataavailable =
                event => {

                    if (
                        event.data.size >
                        0
                    ) {

                        audioChunks.push(
                            event.data
                        );

                    }

                };


            mediaRecorder.onstop =
                async () => {

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );


                    if (
                        audioChunks.length
                    ) {

                        const blob =
                            new Blob(
                                audioChunks,
                                {
                                    type:
                                        "audio/webm"
                                }
                            );


                        const reader =
                            new FileReader();


                        reader.readAsDataURL(
                            blob
                        );


                        reader.onloadend =
                            async () => {

                                try {

                                    const userDoc =
                                        await getDoc(
                                            doc(
                                                db,
                                                "users",
                                                currentUser.uid
                                            )
                                        );


                                    const senderName =
                                        userDoc.exists()
                                            ? userDoc
                                                .data()
                                                .username
                                            : "User";


                                    await addDoc(
                                        collection(
                                            db,
                                            "chats",
                                            currentChatId,
                                            "messages"
                                        ),
                                        {
                                            type:
                                                "voice",

                                            audioData:
                                                reader.result,

                                            senderId:
                                                currentUser.uid,

                                            senderName:
                                                senderName,

                                            timestamp:
                                                serverTimestamp()
                                        }
                                    );

                                } catch (error) {

                                    console.error(
                                        error
                                    );

                                    alert(
                                        "Failed to send voice note."
                                    );

                                }

                            };

                    }


                    resetVoiceUI();

                };


            mediaRecorder.start();


            micBtn.classList.add(
                "recording"
            );


            micBtn.innerHTML =
                `<i class="fa-solid fa-stop"></i>`;


            cancelRecBtn.classList.remove(
                "hidden"
            );


            recordingTimer.classList.remove(
                "hidden"
            );


            recordingInterval =
                setInterval(
                    () => {

                        recordingSeconds++;


                        const mins =
                            Math.floor(
                                recordingSeconds /
                                60
                            );


                        const secs =
                            recordingSeconds %
                            60;


                        recordingTimer.textContent =
                            `${mins}:${secs
                                .toString()
                                .padStart(
                                    2,
                                    "0"
                                )}`;


                        if (
                            recordingSeconds >=
                            MAX_RECORDING_SECONDS
                        ) {

                            stopRecording();

                        }

                    },
                    1000
                );


        } catch (err) {

            alert(
                "Microphone access denied or unavailable."
            );

        }

    }
);


function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ) {

        mediaRecorder.stop();

    }

}


cancelRecBtn.addEventListener(
    "click",
    () => {

        if (
            mediaRecorder &&
            mediaRecorder.state !==
            "inactive"
        ) {

            audioChunks = [];

            mediaRecorder.stop();

        }

        resetVoiceUI();

    }
);


function resetVoiceUI() {

    clearInterval(
        recordingInterval
    );


    micBtn.classList.remove(
        "recording"
    );


    micBtn.innerHTML =
        `<i class="fa-solid fa-microphone"></i>`;


    cancelRecBtn.classList.add(
        "hidden"
    );


    recordingTimer.classList.add(
        "hidden"
    );


    recordingTimer.textContent =
        "0:00";

}


/* =========================================================
   MODALS
========================================================= */

newGroupBtn.onclick =
    () => showGroupModal();


newDmBtn.onclick =
    () =>
        showModal(
            "Start 1-on-1",
            "Enter exact Display Name",
            "direct"
        );


modalCancel.onclick =
    () =>
        modal.classList.add(
            "hidden"
        );


function showGroupModal() {

    modalTitle.textContent =
        "Create Group";


    if (
        knownUsers.length === 0
    ) {

        modalContent.innerHTML =
            `<p class="text-white/70 mb-4">
                You need to start a 1-on-1
                chat with someone first.
             </p>`;

    } else {

        modalContent.innerHTML = `

            <input
                id="group-name-input"
                type="text"
                class="glass-input w-full p-3 rounded-xl mb-4 text-white"
                placeholder="Enter Group Name"
            >

            <h3 class="text-white font-semibold mb-3 text-sm">
                Add Members
            </h3>

            <div
                id="member-selection"
                class="max-h-48 overflow-y-auto space-y-2 mb-4"
            ></div>

        `;


        const selection =
            document.getElementById(
                "member-selection"
            );


        knownUsers.forEach(
            user => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "flex items-center gap-3 p-2 rounded-lg";


                div.innerHTML = `

                    <input
                        type="checkbox"
                        class="user-checkbox member-checkbox"
                        value="${user.id}"
                    >

                    <div class="flex-1 text-white text-sm">
                        ${user.username}
                    </div>

                `;


                selection.appendChild(
                    div
                );

            }
        );

    }


    modal.classList.remove(
        "hidden"
    );


    modalSave.onclick =
        async () => {

            if (
                knownUsers.length ===
                0
            ) {

                modal.classList.add(
                    "hidden"
                );

                return;

            }


            const groupName =
                document.getElementById(
                    "group-name-input"
                )
                .value
                .trim();


            const selectedMembers =
                Array.from(
                    document.querySelectorAll(
                        ".member-checkbox:checked"
                    )
                )
                .map(
                    cb => cb.value
                );


            if (!groupName) {

                alert(
                    "Please enter a group name."
                );

                return;

            }


            if (
                selectedMembers.length ===
                0
            ) {

                alert(
                    "Please select at least one member."
                );

                return;

            }


            try {

                await addDoc(
                    collection(
                        db,
                        "chats"
                    ),
                    {
                        name:
                            groupName,

                        type:
                            "group",

                        members: [
                            currentUser.uid,
                            ...selectedMembers
                        ],

                        createdAt:
                            serverTimestamp(),

                        unreadCounts:
                            {}
                    }
                );


                modal.classList.add(
                    "hidden"
                );


            } catch (e) {

                alert(
                    "Failed to create group."
                );

            }

        };

}


function showModal(
    title,
    placeholder,
    type
) {

    modalTitle.textContent =
        title;


    modalContent.innerHTML = `

        <input
            id="modal-input"
            type="text"
            class="glass-input w-full p-3 rounded-xl mb-4 text-white"
            placeholder="${placeholder}"
        >

    `;


    modal.classList.remove(
        "hidden"
    );


    modalSave.onclick =
        async () => {

            const val =
                document.getElementById(
                    "modal-input"
                )
                .value
                .trim();


            if (!val)
                return;


            modal.classList.add(
                "hidden"
            );


            try {

                const userQuery =
                    query(
                        collection(
                            db,
                            "users"
                        ),
                        where(
                            "username",
                            "==",
                            val
                        )
                    );


                const querySnapshot =
                    await getDocs(
                        userQuery
                    );


                if (
                    querySnapshot.empty
                ) {

                    alert(
                        "User not found. Check the exact spelling."
                    );

                    return;

                }


                let targetUser =
                    null;


                querySnapshot.forEach(
                    d => {

                        targetUser = {
                            id: d.id,
                            ...d.data()
                        };

                    }
                );


                if (
                    targetUser.id ===
                    currentUser.uid
                ) {

                    alert(
                        "You cannot message yourself."
                    );

                    return;

                }


                const chatId =
                    [
                        currentUser.uid,
                        targetUser.id
                    ]
                    .sort()
                    .join("_");


                await setDoc(
                    doc(
                        db,
                        "chats",
                        chatId
                    ),
                    {
                        type:
                            "direct",

                        members: [
                            currentUser.uid,
                            targetUser.id
                        ],

                        createdAt:
                            serverTimestamp(),

                        unreadCounts:
                            {}
                    },
                    {
                        merge: true
                    }
                );


            } catch (e) {

                alert(
                    "Failed to start chat."
                );

            }

        };

}

</script>
